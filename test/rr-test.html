<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test</title>
<style>body{background:#111;color:#ddd;font:13px monospace;padding:12px}.p{color:#7f7}.f{color:#f77}</style>
<script src="rr.js"></script></head>
<body><pre id="out"></pre>
<script>
(async function () {
  var out = document.getElementById('out'), t0 = performance.now(), fails = 0;
  window.__done = false;
  function line(s, c) { var e = document.createElement('div'); if (c) e.className = c; e.textContent = (Math.round(performance.now() - t0) / 1000).toFixed(1) + 's ' + s; out.appendChild(e); }
  function ok(c, m) { if (!c) fails++; line((c ? 'PASS ' : 'FAIL ') + m, c ? 'p' : 'f'); }
  async function T(name, f) { try { await f(); } catch (e) { ok(false, name + ': ' + e.message); } }
  var R = window.rr;
  ok(R && R.v === 1, 'loaded, version ' + (R && R.v) + ', hosts ' + JSON.stringify(R.opt.hosts));
  await T('chain', async function () {
    var tip = await R.height(), h = await R.hash(), tm = await R.time();
    ok(tip > 975000 && /^[0-9a-f]{64}$/.test(h) && tm > 1.7e9, 'tip ' + tip + ', hash ' + h.slice(0, 16) + ', time ' + tm);
  });
  await T('block 840000', async function () {
    var i = await R.info(840000), b = await R.block(840000);
    ok(b.count === i.transaction_count, 'transactions: ' + b.count + ' (ord says ' + i.transaction_count + ')');
    ok(b.hash === i.hash, 'block hash matches: ' + b.hash.slice(0, 20));
    ok(b.ok === true, 'every transaction matches the header (merkle)');
    ok(b.size === i.total_size && b.weight === i.total_weight, 'size ' + b.size + ' / weight ' + b.weight + ' (ord: ' + i.total_size + ' / ' + i.total_weight + ')');
    ok(b.coinbaseHeight === 840000 && b.time === i.timestamp, 'height from coinbase ' + b.coinbaseHeight + ', time ' + b.time);
    var x = b.txs[1], t = await R.tx(x.txid);
    ok(t.txid === x.txid && t.size === x.size && t.outs.length === x.outs.length && t.value === x.value, 'one transaction read alone matches: ' + x.txid.slice(0, 16));
    var kinds = {}, names = [];
    b.txs.forEach(function (tx) { R.marks(tx).forEach(function (m) { kinds[m.kind] = (kinds[m.kind] || 0) + 1; if (m.kind === 'runes' && m.etching && m.etching.name) names.push(m.etching.name); }); });
    ok(kinds.runes > 0, 'marks in block 840000: ' + JSON.stringify(kinds));
    ok(names.indexOf('DOG•GO•TO•THE•MOON') >= 0, 'runes made in block 840000 include DOG•GO•TO•THE•MOON (' + names.length + ' made: ' + names.slice(0, 4).join(', ') + '...)');
  });
  await T('addresses', async function () {
    var ids = ['6fb976ab49dcec017f1e201e84395983204ae1a7c2abf7ced0a85d692e442799i0', '985cb0be7a7acebb8a839e27e0188bda0187bf9187600a4de6a355b5d30432e8i0'];
    for (var k = 0; k < ids.length; k++) {
      var o = await R.ins(ids[k]), op = o.output.split(':'), t = await R.tx(op[0]);
      ok(t.outs[+op[1]].address === o.address, 'owner address from raw bytes = ord: ' + o.address);
    }
  });
  await T('inscriptions', async function () {
    var id = '985cb0be7a7acebb8a839e27e0188bda0187bf9187600a4de6a355b5d30432e8i0', o = await R.ins(id), t = await R.tx(id.slice(0, 64)), L = R.inscriptionsIn(t);
    ok(L[0].id === id && L[0].type === o.content_type && L[0].size === o.content_length, 'gallery inscription read from its transaction: ' + L[0].type + ', ' + L[0].size + ' bytes');
    ok(L[0].props && L[0].props.length === 3755 && L[0].propsEncoding === 'br', 'its gallery list is there: ' + (L[0].props && L[0].props.length) + ' bytes, packed (' + L[0].propsEncoding + ')');
    var kid = '16c95216e6441505fe07a9f07b1c2817ece274092427e9d1cb5d921f8ddd40d7i0', par = '451accbce30177c23a8cd42ab85131312a449359ada3c054aa147b054136fa3bi0';
    var kt = await R.tx(kid.slice(0, 64)), K = R.inscriptionsIn(kt).filter(function (e) { return e.id === kid; })[0];
    ok(K && K.parents.indexOf(par) >= 0, 'child knows its parent: ' + (K && K.parents.join(',').slice(0, 20)));
    var pp = await R.parents(kid);
    ok(pp.ids && pp.ids.indexOf(par) >= 0, 'ord agrees on the parent');
    var m1 = await R.meta(kid), m2 = K && K.meta ? R.cbor(K.meta) : null;
    ok(m1 && JSON.stringify(m1) === JSON.stringify(m2), 'metadata from ord = metadata from the bytes: ' + JSON.stringify(m1).slice(0, 60));
    var kids = await R.allKids(par, 2);
    ok(kids.length === 200 && kids.indexOf(kid) >= 0, 'children, two pages: ' + kids.length);
    var c = await R.content(id, 'bytes');
    ok(c.length === o.content_length, 'content as bytes: ' + c.length);
  });
  await T('land', async function () {
    var a = await R.land(100);
    ok(a.number === 11074513 && a.height === 793279, '100 -> #' + a.number + ' in block ' + a.height);
    var b = await R.land(969788, {onStep: function (h) { line('  reading block ' + h); }});
    ok(b.id === '2db4fa238b2dd2bef8349b751325abf39e1ae7665411d833203cdd5a9b2682b9i0', '969788 -> ' + (b.id || JSON.stringify(b)).slice(0, 20) + ' #' + b.number);
    var c = await R.land(975215);
    ok(c.id === 'd1b4da3f7847080b48be31cd0b6084f674418b6c1c8dedce83db028a999cbb22i0', '975215 -> ' + (c.id || JSON.stringify(c)).slice(0, 20));
    var d = await R.land(99999999);
    ok(d.none && d.notYet, 'a block not mined yet: ' + JSON.stringify(d));
  });
  await T('cat', async function () {
    var b = await R.block(824205), cats = b.txs.filter(function (t) { return R.marks(t).some(function (m) { return m.kind === 'cat21'; }); });
    ok(cats.length >= 1, 'block 824,205 has the first CAT-21 cat: ' + cats.length + ' (' + (cats[0] && cats[0].txid.slice(0, 16)) + ')');
  });
  await T('stamps', async function () {
    var b = await R.block(779652), cp = 0, ms = 0;
    b.txs.forEach(function (t) { R.marks(t).forEach(function (m) { if (m.kind === 'counterparty') cp++; if (m.kind === 'multisig') ms++; }); });
    ok(cp > 0, 'block 779,652 (the first stamp): counterparty messages ' + cp + ', multisig data ' + ms);
  });
  await T('gentle', async function () {
    var E = performance.getEntriesByType('resource').filter(function (e) { return /ordinals\.com/.test(e.name); }), gmin = 1e9, i;
    for (i = 1; i < E.length; i++) gmin = Math.min(gmin, E[i].startTime - (E[i - 1].startTime));
    var before = R.count.asked; await R.ins('985cb0be7a7acebb8a839e27e0188bda0187bf9187600a4de6a355b5d30432e8i0'); await R.tx('985cb0be7a7acebb8a839e27e0188bda0187bf9187600a4de6a355b5d30432e8');
    ok(R.count.asked === before, 'asking again uses the kept answers (no new asks)');
    ok(gmin >= 340, E.length + ' asks to ordinals.com, never closer than ' + Math.round(gmin) + ' ms apart');
    line('asked ' + R.count.asked + ', answered from memory ' + R.count.kept);
  });
  line(fails ? fails + ' FAILED' : 'ALL PASSED', fails ? 'f' : 'p');
  window.__done = true; window.__fails = fails;
})();
</script></body></html>
