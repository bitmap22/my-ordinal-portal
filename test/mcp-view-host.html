<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Agent Blockhall view in a stand-in chat app (MCP Apps)</title>
<style>body{font:14px system-ui;margin:16px;background:var(--bg);color:var(--fg)} body.dark{--bg:#1f1e1d;--fg:#eee} body.light{--bg:#faf9f5;--fg:#222}
#bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px} iframe{display:block;width:100%;max-width:720px;border:0;margin:0 auto;background:transparent} #log{max-width:720px;margin:10px auto;font:12px ui-monospace;white-space:pre-wrap;opacity:.8}</style></head>
<body class="dark"><div id="bar"><select id="pick"></select><button id="theme">Light / dark</button><span id="what"></span></div>
<iframe id="f" sandbox="allow-scripts" title="view"></iframe><div id="log"></div>
<script>
// A stand-in for a chat app that shows MCP Apps (2026-01-26): it loads the view with the spec's restrictive default CSP,
// in a sandboxed frame with no same-origin access, answers ui/initialize, then sends the tool's input and a real answer
// saved from the live tool. Test only.
const CSP = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'";
const f = document.getElementById('f'), log = s => { document.getElementById('log').textContent += s + '\n'; };
let samples = [], cur = null, theme = 'dark', viewHtml = '';
const VARS = {dark: {'--color-background-primary': '#262624', '--color-background-secondary': '#30302e', '--color-text-primary': '#f5f4ef', '--color-text-secondary': '#b7b5a9', '--color-border-primary': '#3e3e38', '--font-sans': 'system-ui, sans-serif'},
  light: {'--color-background-primary': '#ffffff', '--color-background-secondary': '#f5f4ed', '--color-text-primary': '#1f1e1d', '--color-text-secondary': '#5e5d59', '--color-border-primary': '#e5e3da', '--font-sans': 'system-ui, sans-serif'}};
window.addEventListener('message', ev => {
  if (ev.source !== f.contentWindow) return; const m = ev.data; if (!m || m.jsonrpc !== '2.0') return;
  const answer = (result, error) => f.contentWindow.postMessage(Object.assign({jsonrpc: '2.0', id: m.id}, error ? {error} : {result}), '*');
  if (m.method === 'ui/initialize') answer({protocolVersion: '2026-01-26', hostInfo: {name: 'stand-in host', version: '1'}, hostCapabilities: {openLinks: {}, serverTools: {}},
    hostContext: {theme, styles: {variables: VARS[theme]}, displayMode: 'inline', containerDimensions: {width: 720, maxHeight: 3000}, toolInfo: {tool: {name: cur.tool, title: cur.title || cur.tool}}}});
  else if (m.method === 'ui/notifications/initialized') { f.contentWindow.postMessage({jsonrpc: '2.0', method: 'ui/notifications/tool-input', params: {arguments: cur.args}}, '*');
    setTimeout(() => f.contentWindow.postMessage({jsonrpc: '2.0', method: 'ui/notifications/tool-result', params: cur.result}, '*'), 900); }
  else if (m.method === 'ui/notifications/size-changed') { f.style.height = m.params.height + 'px'; log('size ' + m.params.width + 'x' + m.params.height); }
  else if (m.method === 'ui/open-link') { log('open-link ' + m.params.url); answer({}); }
  else if (m.method === 'tools/call') { log('tools/call ' + JSON.stringify(m.params)); answer(null, {code: -32000, message: 'no server in this test'}); }
  else if (m.id != null) answer(null, {code: -32601, message: 'Method not found'});
});
function show(i) { cur = samples[i]; document.getElementById('what').textContent = cur.from; document.getElementById('log').textContent = '';
  f.style.height = '200px'; f.srcdoc = viewHtml.replace(/<head>/i, '<head><meta http-equiv="Content-Security-Policy" content="' + CSP + '">'); }
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; document.body.className = theme; show(+document.getElementById('pick').value); };
(async () => {
  viewHtml = await (await fetch('mcp-view.html?t=' + Date.now(), {cache: 'no-store'})).text();
  samples = await (await fetch('mcp-view-samples.json?t=' + Date.now(), {cache: 'no-store'})).json();
  const p = document.getElementById('pick'); samples.forEach((s, i) => p.append(new Option(s.tool + ' ' + JSON.stringify(s.args), i)));
  p.onchange = () => show(+p.value); const q = +(new URLSearchParams(location.search).get('n') || 0); p.value = q;
  if (new URLSearchParams(location.search).get('theme') === 'light') { theme = 'light'; document.body.className = 'light'; }
  show(q);
})();
</script></body></html>
