<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test</title>
<style>body{background:#111;color:#ddd;font:13px monospace;padding:12px}.p{color:#7f7}.f{color:#f77}#g{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#g figure{margin:0;background:#222;padding:4px;width:150px}#g img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;background:#000}#g figcaption{font-size:10px;word-break:break-all}</style>
<script src="rr.js"></script></head>
<body><pre id="out"></pre><div id="g"></div>
<script>
(async function () {
  var out = document.getElementById('out'), G = document.getElementById('g'), t0 = performance.now(), R = window.rr;
  window.__S = {found: [], done: false};
  function line(s, c) { var e = document.createElement('div'); if (c) e.className = c; e.textContent = (Math.round(performance.now() - t0) / 1000).toFixed(1) + 's ' + s; out.appendChild(e); }
  var blocks = [779652, 779700, 790000, 835000, 836000, 845000, 865100, 880000];
  for (var bi = 0; bi < blocks.length; bi++) {
    var h = blocks[bi], b;
    try { b = await R.block(h); } catch (e) { line('block ' + h + ': ' + e.message, 'f'); continue; }
    var n = {classic: 0, olga: 0, 'src-20': 0, stamp: 0}, shown = 0;
    for (var i = 0; i < b.txs.length; i++) {
      var tx = b.txs[i], st = R.stamp(tx);
      if (!st) continue;
      n[st.proto] = (n[st.proto] || 0) + 1;
      if (st.bytes) {
        var bytes = await R.unpack(st.bytes), type = R.sniff(bytes) || st.type, okImg = null;
        if (/^image\//.test(type) && type !== 'image/svg+xml') { try { var bm = await createImageBitmap(new Blob([bytes], {type: type})); okImg = bm.width + 'x' + bm.height; } catch (e) { okImg = 'BAD IMAGE'; } }
        window.__S.found.push({h: h, i: i, txid: tx.txid, proto: st.proto, type: type, size: bytes.length, img: okImg});
        if (shown < 6) {
          shown++;
          var f = document.createElement('figure');
          f.innerHTML = /^image\//.test(type) ? '<img src="' + R.dataUrl(bytes, type) + '">' : '<div style="height:150px;overflow:hidden;font-size:9px">' + R.utf8(bytes.subarray(0, 300)).replace(/</g, '&lt;') + '</div>';
          var c = document.createElement('figcaption'); c.textContent = h + ' #' + i + ' ' + st.proto + ' ' + type + ' ' + bytes.length + 'B ' + (okImg || ''); f.appendChild(c); G.appendChild(f);
        }
      } else if (st.json && window.__S.found.filter(function (x) { return x.proto === 'src-20'; }).length < 3) window.__S.found.push({h: h, i: i, proto: st.proto, json: st.json});
    }
    line('block ' + h + ' (' + b.count + ' tx, ok ' + b.ok + '): ' + JSON.stringify(n), 'p');
  }
  window.__S.done = true; line('done, asked ' + R.count.asked);
})();
</script></body></html>
