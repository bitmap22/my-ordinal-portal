<body>
<canvas id="c"></canvas>
<div id="strip"><div id="fut"></div><div id="sep"></div><div id="past"></div></div>
<div id="top"><div id="tg" class="m"><i></i><span id="tgt">&nbsp;</span></div><input id="h" class="m" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="block"><div id="st" class="m">&nbsp;</div><div id="ot" class="m"></div><div id="fs" class="m"></div></div>
<div id="nav"><button id="pv" aria-label="previous block">&lsaquo;</button><button id="lv" class="on" aria-label="live next block"><i></i>LIVE</button><button id="nx" aria-label="next block">&rsaquo;</button><button id="ln" class="m" aria-label="switch between fees and ordinals">FEES</button><button id="xr" aria-label="x-ray: see inside the cube"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 10s3.2-6 8.5-6 8.5 6 8.5 6-3.2 6-8.5 6-8.5-6-8.5-6z"/><circle cx="10" cy="10" r="2.6"/></svg></button><button id="op" aria-label="open the layers"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="2" width="14" height="4" rx="1"/><rect x="3" y="8" width="14" height="4" rx="1"/><rect x="3" y="14" width="14" height="4" rx="1"/></svg></button></div>
<div id="kinds" class="m"><div id="kh">PARCEL TYPES<span></span></div><div id="kl"></div></div>
<div id="card" class="m"><div id="cn"></div><div id="cr"></div><div id="ct"></div><div id="cp"></div></div>
<button id="fb" class="m" aria-label="show or hide the live feed">FEED</button>
<div id="tools"><button id="tp" class="tl" aria-label="flip back through blocks" title="flip back through blocks"></button><button id="ts" class="tl" aria-label="save a picture" title="save a picture"></button><button id="tu" class="tl" aria-label="sound on or off" title="sound on / off"></button></div>
<div id="feed" class="m"><div id="fh">LIVE FEED</div><div id="fl"></div><div id="fh2" class="fh">JOINING THE NEXT BLOCK</div><div id="ft"></div></div>
<script>
'use strict';
/* ---------- data sources: set on:false to switch one off ---------- */
const SOURCES = [
  {name:'mempool.space', on:true, kind:'mempool', base:'https://mempool.space'},
  {name:'this ordinal',  on:true, kind:'ord',     base:''},
  {name:'ordinals.com',  on:true, kind:'ord',     base:'https://ordinals.com'}
];
const LIVE_FEED = 'wss://mempool.space/api/v1/ws';   // mempool.space's live feed of the next block
const ORD_EXPLORERS = ['https://ordinals.com', ''];   // ord explorers that list each block's inscriptions ('' = the site this runs on)
const BLOCK_VB = 1e6;   // a block holds 1,000,000 vB
const S = 10;           // cube side in the 3D world

/* ---------- fetching ---------- */
function fetchT(url, opt, ms) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms || 25000);
  return fetch(url, Object.assign({signal: ac.signal}, opt || {})).then(r => {
    clearTimeout(t); if (!r.ok) throw new Error('http ' + r.status); return r;
  }, e => { clearTimeout(t); throw e; });
}
function vlen(n) { return n < 0xfd ? 1 : n <= 0xffff ? 3 : n <= 0xffffffff ? 5 : 9; }
// exact weight of one transaction from ord's JSON (base bytes x4 + witness bytes)
function txWeight(tx) {
  const ins = tx.input, outs = tx.output;
  let base = 8 + vlen(ins.length) + vlen(outs.length), wit = 0, hasW = false;
  for (const i of ins) { const l = i.script_sig.length >> 1; base += 40 + vlen(l) + l; if (i.witness && i.witness.length) hasW = true; }
  for (const o of outs) { const l = o.script_pubkey.length >> 1; base += 8 + vlen(l) + l; }
  if (hasW) {
    wit = 2;
    for (const i of ins) { const w = i.witness || []; wit += vlen(w.length); for (const x of w) { const l = x.length >> 1; wit += vlen(l) + l; } }
  }
  return base * 4 + wit;
}
const SRC = {
  mempool: {
    async tip(b) {
      const n = parseInt(await (await fetchT(b + '/api/blocks/tip/height', {cache: 'no-store'}, 12000)).text());
      if (!(n > 0)) throw new Error('bad tip'); return n;
    },
    async block(b, h) {
      const hash = (await (await fetchT(b + '/api/block-height/' + h)).text()).trim();
      if (!/^[0-9a-f]{64}$/.test(hash)) throw new Error('bad hash');
      const [meta, sum] = await Promise.all([
        fetchT(b + '/api/block/' + hash).then(r => r.json()),
        fetchT(b + '/api/v1/block/' + hash + '/summary', null, 60000).then(r => r.json())]);
      if (!sum.length) throw new Error('empty');
      const txs = sum.map((t, i) => ({id: t.txid, fee: t.fee, vsize: t.vsize, value: t.value || 0, rate: t.rate || (t.vsize ? t.fee / t.vsize : 0), idx: i, insc: tagged(t.flags)}));
      return {height: h, hash, time: meta.timestamp, size: meta.size, weight: meta.weight, count: meta.tx_count || txs.length, txs, fees: true};
    }
  },
  ord: {
    async tip(b) {
      const n = +(await (await fetchT(b + '/r/blockheight', {cache: 'no-store'}, 12000)).json());
      if (!(n >= 0)) throw new Error('bad tip'); return n;
    },
    async block(b, h) {
      const [info, blk] = await Promise.all([
        fetchT(b + '/r/blockinfo/' + h).then(r => r.json()),
        fetchT(b + '/block/' + h, {headers: {Accept: 'application/json'}}, 120000).then(r => r.json())]);
      const raw = blk.transactions, n = raw ? raw.length : 0;
      if (!n || (info.transaction_count && info.transaction_count !== n)) throw new Error('bad block');
      // the chain itself does not list each transaction's fee, so fee rates are unknown here
      const txs = raw.map((tx, i) => { let v = 0; for (const o of tx.output) v += o.value; return {id: null, fee: -1, vsize: txWeight(tx) / 4, value: v, rate: -1, idx: i, raw: tx}; });
      return {height: h, hash: info.hash || blk.hash, time: info.timestamp, size: info.total_size, weight: info.total_weight, count: n, txs, fees: false};
    }
  }
};
let goodSrc = null;
async function viaSources(job) {
  const list = SOURCES.filter(s => s.on && s !== goodSrc);
  if (goodSrc && goodSrc.on) list.unshift(goodSrc);
  let err = new Error('no data source');
  for (const s of list) {
    try { const r = await job(SRC[s.kind], s.base); goodSrc = s; return r; } catch (e) { err = e; }
  }
  throw err;
}

/* ---------- keep the cube and the floating text clear of every piece of text on screen ---------- */
const $strip = document.getElementById('strip'), $nav = document.getElementById('nav'), $top = document.getElementById('top'), $ot = document.getElementById('ot');
