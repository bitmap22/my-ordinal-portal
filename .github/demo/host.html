<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Agent Blockhall</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}[data-agentbox]{display:none!important}</style></head>
<body><iframe id="g" allow="autoplay"></iframe>
<script>
// for filming only: holds the game, as the play-together page does, and passes crew messages to it
window.__got = [];
addEventListener('message', e => { if (e.data && e.data.app === 'blockcube') __got.push(e.data); });
window.send = m => document.getElementById('g').contentWindow.postMessage(Object.assign({app: 'blockcube-host'}, m), '*');
document.getElementById('g').src = new URLSearchParams(location.search).get('game');
</script></body></html>
