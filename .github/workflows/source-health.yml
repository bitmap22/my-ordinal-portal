# Source Health: about once an hour, ask each data site the portal's tools read one small thing, and keep a week of the
# answers on the source-health branch (remade each time, so it holds only the newest copy). Free: GitHub runs it.
# It only writes to the source-health branch. To run it by hand: Actions > Source Health > Run workflow.
name: Source Health

on:
  schedule:
    # GitHub starts this repo's timed jobs late, sometimes by hours (measured 15 Nov 2026: Rare sats ran 40 minutes to 5 hours
    # late, and none of Source Health's first three hourly starts came within 3 hours). So it is asked four times an hour, and
    # the first step skips the check if one was saved in the last 50 minutes: it still checks about once an hour. The keeper
    # (keeper.yml) also starts it on pushes to main when it is due.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      ifDue:
        description: 'yes: only check if the last check is 50 minutes old or more (the keeper uses this). Leave empty to always check.'
        required: false

permissions:
  contents: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Was there a check in the last 50 minutes?
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits/source-health" --jq .commit.committer.date 2>/dev/null || true)
          age=999999
          if [ -n "$last" ]; then age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) )); fi
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.ifDue }}" = "yes" ]; } && [ "$age" -lt 3000 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "The last check was saved $((age / 60)) minutes ago: not due yet."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.due.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.due.outputs.go == 'true'
        with:
          node-version: 20
      - name: Last week's record
        if: steps.due.outputs.go == 'true'
        run: |
          mkdir -p health
          # (23 Nov 2026) if the branch is there but can't be read, stop: saving now would start the record again and wipe it
          if git fetch -q --depth 1 origin source-health; then git show FETCH_HEAD:week.json > health/week.json || { echo "Couldn't read last week's record, so nothing is saved this time (saving now would start the record again and lose it). The keeper tries again within the hour."; exit 1; }
          else h=$(git ls-remote --heads origin source-health) || { echo "Couldn't read last week's record, so nothing is saved this time (saving now would start the record again and lose it). The keeper tries again within the hour."; exit 1; }; [ -z "$h" ] || { echo "Couldn't read last week's record, so nothing is saved this time (saving now would start the record again and lose it). The keeper tries again within the hour."; exit 1; }; fi
      - name: Ask each site
        if: steps.due.outputs.go == 'true'
        run: node .github/source-health/check.js health
      - name: Save it
        if: steps.due.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/source-health/README.md health/README.md
          cd health
          git init -q -b source-health
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Source Health: $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source-health
