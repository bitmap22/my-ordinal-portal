name: t-space test (temporary)
on:
  push:
    branches: [t-space]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find today's facts (test, not saved)
        run: mkdir -p hl && node .github/highlights/build-highlights.js hl && node -e "const j=require('./hl/highlights.json'); for (const [k,v] of Object.entries(j.facts)) console.log(k, '|', v.link, '|', v.linkText)"
