# The keeper. GitHub starts this repo's timed jobs late, or not at all (23 Nov 2026: in 48 hours the keeper's own timer fired 4
# times out of 96, and Highlights was not made for 33 hours). So the keeper keeps itself going, the way the Bitmap Record does:
# each run looks at what is due every 10 minutes for about 50 minutes, then starts the next keeper run itself. GitHub's timer and
# every push to main also start it, in case that chain ever breaks. Each look starts what is due: Source Health if its last check
# is 55 minutes old or more, the Safety Scan if its last scan is an hour old or more, the Truth League if its last is 175
# minutes old or more, Daily Data from 00:20 UTC and Doge Daily Data from 00:47 UTC if the day before isn't saved yet, Rare sats
# from 07:17 UTC if today's prices aren't read yet, Highlights once yesterday's Daily Data is saved and they were made before it,
# the Corridor shelves if they last ran 35 minutes ago or more, Hall Visits if it last ran 5 hours ago or more, and the Bitmap
# Record if it has not run for 75 minutes. It only starts those workflows, each of which still checks for itself that there is
# something to do. Free: GitHub runs it (the repository is public). © 2026 bitmap22. All rights reserved.
name: Keeper

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: true

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Start what is due, every 10 minutes for about 50 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          busy() { gh api "repos/$R/actions/workflows/$1/runs?per_page=10" --jq '[.workflow_runs[] | select(.status != "completed")] | length'; }
          lastrun() { gh api "repos/$R/actions/workflows/$1/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' 2>/dev/null || true; }
          look() {
            now=$(date -u +%s)
            # Source Health: about once an hour
            last=$(gh api "repos/$R/commits/source-health" --jq .commit.committer.date 2>/dev/null || true)
            age=999999; [ -n "$last" ] && age=$(( now - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt 3300 ]; then echo "Source Health: not due (its last check was $((age / 60)) minutes ago)"
            elif [ "$(busy source-health.yml)" != "0" ]; then echo "Source Health: already running"
            else gh api -X POST "repos/$R/actions/workflows/source-health.yml/dispatches" -f ref=main -f "inputs[ifDue]=yes" && echo "Source Health: started (its last check was $((age / 60)) minutes ago)"; fi
            # Safety Scan: about once an hour
            last=$(gh api "repos/$R/commits/safety-scan" --jq .commit.committer.date 2>/dev/null || true)
            age=999999; [ -n "$last" ] && age=$(( now - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt 3600 ]; then echo "Safety Scan: not due (its last scan was $((age / 60)) minutes ago)"
            elif [ "$(busy safety-scan.yml)" != "0" ]; then echo "Safety Scan: already running"
            else gh api -X POST "repos/$R/actions/workflows/safety-scan.yml/dispatches" -f ref=main -f "inputs[ifDue]=yes" && echo "Safety Scan: started (its last scan was $((age / 60)) minutes ago)"; fi
            # Truth League: about every 3 hours
            last=$(gh api "repos/$R/commits/truth-league" --jq .commit.committer.date 2>/dev/null || true)
            age=999999; [ -n "$last" ] && age=$(( now - $(date -u -d "$last" +%s) ))
            if [ "$age" -lt 10500 ]; then echo "Truth League: not due (its last check was $((age / 60)) minutes ago)"
            elif [ "$(busy truth-league.yml)" != "0" ]; then echo "Truth League: already running"
            else gh api -X POST "repos/$R/actions/workflows/truth-league.yml/dispatches" -f ref=main -f "inputs[ifDue]=yes" && echo "Truth League: started (its last check was $((age / 60)) minutes ago)"; fi
            # Daily Data (from 00:20 UTC) and Doge Daily Data (from 00:47 UTC): the day before, if it isn't saved yet
            DAY=$(date -u -d yesterday +%F); mins=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            for x in "daily-data.yml daily-data 20" "doge-daily-data.yml doge-daily-data 47"; do
              set -- $x
              if [ "$mins" -lt "$3" ]; then echo "$1: not yet (it starts at 00:$3 UTC)"; continue; fi
              if gh api "repos/$R/contents/days/$DAY.json?ref=$2" --silent 2>/dev/null; then echo "$1: $DAY is saved"; continue; fi
              if [ "$(busy "$1")" != "0" ]; then echo "$1: already running"; continue; fi
              gh api -X POST "repos/$R/actions/workflows/$1/dispatches" -f ref=main -f "inputs[onlyIfMissing]=yes" && echo "$1: started for $DAY"
            done
            # Rare sats (from 07:17 UTC): today's prices, if they aren't read yet (as its timed runs: from 19:17 UTC it is the last try)
            TODAY=$(LC_ALL=C TZ=Europe/London date +'%-d %b %Y')
            if [ "$mins" -lt 437 ]; then echo "Rare sats: not yet (it starts at 07:17 UTC)"
            else
              got=$(gh api "repos/$R/contents/rare-sats.json?ref=rare-sats" --jq .content 2>/dev/null | base64 -di 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("read", ""))' 2>/dev/null || true)
              [ -n "$got" ] || got=$(gh api "repos/$R/contents/rare-sats.json?ref=main" --jq .content 2>/dev/null | base64 -di 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("read", ""))' 2>/dev/null || true)
              if [ "$got" = "$TODAY" ]; then echo "Rare sats: $TODAY is read"
              elif [ "$(busy rare-sats.yml)" != "0" ]; then echo "Rare sats: already running"
              else try=try; [ "$mins" -ge 1157 ] && try=last; gh api -X POST "repos/$R/actions/workflows/rare-sats.yml/dispatches" -f ref=main -f "inputs[keeper]=$try" && echo "Rare sats: started for $TODAY (last read: ${got:-unknown})"; fi
            fi
            # Highlights: once yesterday's Daily Data is saved, if they were made before it
            saved=$(gh api "repos/$R/commits?sha=daily-data&path=days/$DAY.json&per_page=1" --jq '.[0].commit.committer.date // ""' 2>/dev/null || true)
            made=$(gh api "repos/$R/commits/highlights" --jq .commit.committer.date 2>/dev/null || true)
            if [ -z "$saved" ]; then echo "Highlights: waiting for Daily Data's $DAY"
            elif [ -n "$made" ] && [ "$(date -u -d "$made" +%s)" -ge "$(date -u -d "$saved" +%s)" ]; then echo "Highlights: made after $DAY was saved"
            elif [ "$(busy highlights.yml)" != "0" ]; then echo "Highlights: already running"
            else gh api -X POST "repos/$R/actions/workflows/highlights.yml/dispatches" -f ref=main && echo "Highlights: started (made ${made:-never})"; fi
            # Corridor shelves (35 minutes), Hall Visits (5 hours), Bitmap Record (75 minutes): if they have not run for that long
            for x in "corridor-shelves.yml 2100" "hall-visits.yml 18000" "bitmap-record.yml 4500"; do
              set -- $x; l=$(lastrun "$1"); a=999999; [ -n "$l" ] && a=$(( $(date -u +%s) - $(date -u -d "$l" +%s) ))
              if [ "$a" -lt "$2" ]; then echo "$1: ran $((a / 60)) minutes ago"
              elif [ "$(busy "$1")" != "0" ]; then echo "$1: already running"
              else gh api -X POST "repos/$R/actions/workflows/$1/dispatches" -f ref=main && echo "$1: started (it last ran $((a / 60)) minutes ago)"; fi
            done
          }
          start=$(date -u +%s)
          while :; do
            echo "== $(date -u +%H:%M) UTC"; look || echo "(that look had an error; trying again next time)"
            [ $(( $(date -u +%s) - start )) -ge 2700 ] && break
            sleep 600
          done
      - name: Start the next keeper run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$R/actions/workflows/keeper.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status == "queued" or .status == "waiting" or .status == "pending")] | length')
          if [ "$n" != "0" ]; then echo "A keeper run is already waiting: not starting another"; else gh workflow run keeper.yml --repo "$R" --ref main && echo "Next keeper run started"; fi
