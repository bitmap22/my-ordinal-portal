# The keeper. GitHub starts this repo's timed jobs late, or not at all (15 Nov 2026: Source Health's, Daily Data's and Doge Daily
# Data's starts had not come hours later). But pushes to main happen many times a day, and GitHub starts work for a push straight
# away. So on every push to main (and on its own timed starts, in case of a quiet day) the keeper looks at what is due and starts
# it: Source Health if its last check is 55 minutes old or more, the Truth League if its last is 175 minutes old or more, Daily Data from 00:20 UTC and Doge Daily Data from 00:47 UTC if
# the day before isn't saved yet, and
# Rare sats from 07:17 UTC if today's prices aren't read yet (15 Nov 2026: its 07:17 start had not come 2 hours later). It only starts those workflows, each of which still checks for itself that there is something
# to do. Free: GitHub runs it (the repository is public). © 2026 bitmap22. All rights reserved.
name: Keeper

on:
  push:
    branches: [main]
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: true

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start what is due
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          now=$(date -u +%s)
          busy() { gh api "repos/$R/actions/workflows/$1/runs?per_page=10" --jq '[.workflow_runs[] | select(.status != "completed")] | length'; }
          # Source Health: about once an hour
          last=$(gh api "repos/$R/commits/source-health" --jq .commit.committer.date 2>/dev/null || true)
          age=999999; [ -n "$last" ] && age=$(( now - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 3300 ]; then echo "Source Health: not due (its last check was $((age / 60)) minutes ago)"
          elif [ "$(busy source-health.yml)" != "0" ]; then echo "Source Health: already running"
          else gh api -X POST "repos/$R/actions/workflows/source-health.yml/dispatches" -f ref=main -f "inputs[ifDue]=yes" && echo "Source Health: started (its last check was $((age / 60)) minutes ago)"; fi
          # Truth League: about every 3 hours
          last=$(gh api "repos/$R/commits/truth-league" --jq .commit.committer.date 2>/dev/null || true)
          age=999999; [ -n "$last" ] && age=$(( now - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 10500 ]; then echo "Truth League: not due (its last check was $((age / 60)) minutes ago)"
          elif [ "$(busy truth-league.yml)" != "0" ]; then echo "Truth League: already running"
          else gh api -X POST "repos/$R/actions/workflows/truth-league.yml/dispatches" -f ref=main -f "inputs[ifDue]=yes" && echo "Truth League: started (its last check was $((age / 60)) minutes ago)"; fi
          # Daily Data (from 00:20 UTC) and Doge Daily Data (from 00:47 UTC): the day before, if it isn't saved yet
          DAY=$(date -u -d yesterday +%F); mins=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          for x in "daily-data.yml daily-data 20" "doge-daily-data.yml doge-daily-data 47"; do
            set -- $x
            if [ "$mins" -lt "$3" ]; then echo "$1: not yet (it starts at 00:$3 UTC)"; continue; fi
            if gh api "repos/$R/contents/days/$DAY.json?ref=$2" --silent 2>/dev/null; then echo "$1: $DAY is saved"; continue; fi
            if [ "$(busy "$1")" != "0" ]; then echo "$1: already running"; continue; fi
            gh api -X POST "repos/$R/actions/workflows/$1/dispatches" -f ref=main -f "inputs[onlyIfMissing]=yes" && echo "$1: started for $DAY"
          done
          # Rare sats (from 07:17 UTC): today's prices, if they aren't read yet (as its timed runs: from 19:17 UTC it is the last try)
          TODAY=$(LC_ALL=C TZ=Europe/London date +'%-d %b %Y')
          if [ "$mins" -lt 437 ]; then echo "Rare sats: not yet (it starts at 07:17 UTC)"
          else
            got=$(gh api "repos/$R/contents/rare-sats.json?ref=rare-sats" --jq .content 2>/dev/null | base64 -di 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("read", ""))' 2>/dev/null || true)
            [ -n "$got" ] || got=$(gh api "repos/$R/contents/rare-sats.json?ref=main" --jq .content 2>/dev/null | base64 -di 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("read", ""))' 2>/dev/null || true)
            if [ "$got" = "$TODAY" ]; then echo "Rare sats: $TODAY is read"
            elif [ "$(busy rare-sats.yml)" != "0" ]; then echo "Rare sats: already running"
            else try=try; [ "$mins" -ge 1157 ] && try=last; gh api -X POST "repos/$R/actions/workflows/rare-sats.yml/dispatches" -f ref=main -f "inputs[keeper]=$try" && echo "Rare sats: started for $TODAY (last read: ${got:-unknown})"; fi
          fi
