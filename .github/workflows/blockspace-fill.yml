# Blockspace Share's fill-in: reads the Bitcoin blocks of past days from their own bytes and saves only each day's bytes by kind
# on the daily-data branch (space/). It is for days from before Daily Data counted bytes; each night Daily Data adds the day
# before by itself. Free: GitHub runs it. Only by hand: Actions > Blockspace Share fill-in > Run workflow (give the first and
# last day). It never runs at the same time as Daily Data (they write to the same branch).
name: Blockspace Share fill-in

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'The first UTC day (YYYY-MM-DD)'
        required: true
        default: '2026-10-01'
      to:
        description: 'The last UTC day (YYYY-MM-DD). Leave empty for the day before yesterday.'
        required: false
      redo:
        description: 'yes: read days that are already saved again. Leave empty to skip them.'
        required: false
      folder:
        description: 'The folder to save into (space). A full recount is saved into another folder first (space2), then swapped in.'
        required: false
        default: 'space'

permissions:
  contents: write
  actions: write   # (to start itself again for the days left, if its time runs short)

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Open the daily-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git fetch origin daily-data:daily-data && git worktree add data daily-data
      - name: Read the days, oldest first
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          REDO: ${{ github.event.inputs.redo }}
          SPACE_DIR: ${{ github.event.inputs.folder || 'space' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$TO" ] || TO="$(date -u -d '2 days ago' +%F)"
          for d in "$FROM" "$TO"; do case "$d" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "Days must be YYYY-MM-DD"; exit 1;; esac; done
          START=$(date +%s); DAY="$FROM"; LEFT=""
          while [ ! "$DAY" \> "$TO" ]; do
            if [ -f "data/$SPACE_DIR/days/$DAY.json" ] && [ "$REDO" != "yes" ]; then echo "$DAY is already saved"; else
              # (stop starting new days after 4 hours 50 minutes, well inside the job's time, and start again for the rest)
              if [ $(( $(date +%s) - START )) -gt 17400 ]; then LEFT="$DAY"; break; fi
              node .github/daily-data/space-day.js "$DAY" data || echo "$DAY could not be read"
              # (saved after every day, so no day's work is ever lost)
              (cd data && git add -A && { git commit -qm "Blockspace Share: $DAY" || true; } && git push -q origin daily-data)
            fi
            DAY="$(date -u -d "$DAY + 1 day" +%F)"
          done
          if [ -n "$LEFT" ]; then
            echo "Time is short: starting again from $LEFT to $TO."
            gh workflow run blockspace-fill.yml --ref "${GITHUB_REF_NAME}" -f from="$LEFT" -f to="$TO" -f redo="$REDO" -f folder="$SPACE_DIR"
          fi
