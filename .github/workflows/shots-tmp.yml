name: Share pictures (temporary)
on:
  push:
    branches: [findability-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: bitmap-finder
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          mkdir out
          cat > shot.js <<'JS'
          const { chromium } = require('playwright');
          const pages = process.argv.slice(2);
          (async () => {
            const b = await chromium.launch({args: ['--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist']});
            for (const p of pages) {
              const pg = await b.newPage({ viewport: { width: 1200, height: 628 }, deviceScaleFactor: 1 });
              try { await pg.goto('http://localhost:8000/' + p + '.html', { waitUntil: 'networkidle', timeout: 45000 }); } catch (e) { console.log(p, 'load:', e.message.split('\n')[0]); }
              await pg.waitForTimeout(6000);
              await pg.screenshot({ path: 'out/share-' + p + '.jpg', type: 'jpeg', quality: 85 });
              console.log('done', p);
              await pg.close();
            }
            await b.close();
          })();
          JS
          node shot.js bitmap-finder
      - run: |
          git fetch -q origin findability-shots && git checkout -q -B s FETCH_HEAD && rm -rf shots3 && mkdir shots3 && cp out/*.jpg shots3/ && git add shots3 && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "share pictures 3" && git push origin HEAD:findability-shots
