# Temporary test: can GitHub read the rare sats page? (test branch only, makes no changes)
name: rare sats probe
on:
  push:
    branches: [rare-sats-auto-test]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the page three times, slowly, and compare
        run: |
          python3 - <<'PY'
          import re, json, time, html, urllib.request, urllib.error
          from html.parser import HTMLParser
          UA = "bitmap22-rare-sats-refresh/1.0 (+https://github.com/bitmap22/my-ordinal-portal)"
          def get(u):
              req = urllib.request.Request(u, headers={"User-Agent": UA, "Accept": "text/html,*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, r.headers, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read().decode("utf-8", "replace")
          class Rows(HTMLParser):
              def __init__(s):
                  super().__init__(convert_charrefs=True); s.rows = []; s.row = None; s.cell = None
              def handle_starttag(s, t, a):
                  if t == "tr": s.row = []
                  elif t in ("td", "th") and s.row is not None: s.cell = []
              def handle_endtag(s, t):
                  if t in ("td", "th") and s.cell is not None and s.row is not None:
                      s.row.append(" ".join("".join(s.cell).split())); s.cell = None
                  elif t == "tr" and s.row is not None:
                      s.rows.append(s.row); s.row = None
              def handle_data(s, d):
                  if s.cell is not None: s.cell.append(d)
          def prices(b):
              p = Rows(); p.feed(b)
              return [(r[0], r[1]) for r in p.rows if len(r) >= 2 and r[0] != "Satribute"]
          first = None
          for n, url in enumerate(["https://ordiscan.com/rare-sats"] * 3 + ["https://ordiscan.com/rare-sats?t=%d" % int(time.time())]):
              if n: time.sleep(8)
              s, h, b = get(url)
              print("=" * 70); print("READ", n + 1, url, "status", s, "bytes", len(b))
              for k in ("Date", "Age", "CF-Cache-Status", "x-nextjs-cache", "ETag", "Last-Modified", "Cache-Control", "Vary"):
                  print("   ", k, "=", h.get(k))
              pr = prices(b); print("   ", len(pr), "rows:", pr)
              if first is None: first = pr
              else: print("    same as read 1:", pr == first)
              if n == 0:
                  m = re.search(r'(?s)<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b)
                  if m:
                      raw = m.group(1); print("    NEXT_DATA length", len(raw))
                      try:
                          d = json.loads(raw); pp = d.get("props", {}).get("pageProps", {})
                          print("    buildId", d.get("buildId"), "| page", d.get("page"), "| pageProps keys", list(pp.keys()))
                          print("    pageProps (start):", json.dumps(pp)[:3500])
                      except Exception as e:
                          print("    could not parse NEXT_DATA:", e); print(raw[:2000])
          PY
