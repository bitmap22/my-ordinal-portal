# Temporary: downloads real test blocks for the Block Manifest and saves them on this branch. Changes nothing else.
name: Block Manifest test data
on:
  push:
    branches: [manifest-data]
    paths: ['.github/manifest-data/heights.txt']
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node .github/manifest-data/fetch-data.js manifest-test-data $(cat .github/manifest-data/heights.txt)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add manifest-test-data && git commit -m "Block Manifest test data [skip ci]" && git push origin HEAD:manifest-data
