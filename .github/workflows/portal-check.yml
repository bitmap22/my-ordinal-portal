# The portal's safety check on every change: fails if a page opens a frame without a lock, makes a stranger's picture into an
# address on our own site, leaves a risky button open to AI agents, or holds a script that no longer reads, so a page that
# would stop working cannot go live by mistake (see .github/checks/portal-check.js for the rules).
# Free: GitHub runs it. It only reads the repository. © 2026 bitmap22. All rights reserved.
name: Portal check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the pages
        run: node .github/checks/portal-check.js
