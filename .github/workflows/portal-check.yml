# The portal's safety check on every change: fails if a page opens a frame without a lock, makes a stranger's picture into an
# address on our own site, or leaves a risky button open to AI agents (see .github/checks/portal-check.js for the rules).
# Free: GitHub runs it. It only reads the repository. © 2026 bitmap22. All rights reserved.
name: Portal check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the pages
        run: node .github/checks/portal-check.js
